                            lastGain = Math.round((gain2+lastGain*5)/6*100)/100;
                        }
                        
                        el.xSoundFixerGain.gain.value = lastGain;
                        
                                            }
                }
                    });
        
        
        var lastPlayerError = 0;
        var timeoutCue = null;
        
        function logPlayerError(event, msg){
            if (event != 'warning' && Date.now() > lastPlayerError+60000) {
                lastPlayerError = Date.now();
                
                var reportRequest = new XMLHttpRequest();
                reportRequest['open']('GET', '/json/logStreamError/371517/?event='+event+'&msg='+encodeURI(msg));
                reportRequest['send']();
                
                //if (msg == '232403' || msg == '233403' || msg == '232600') {
                //    playerInstance.remove();
                //    alert("بند اول قوانین و شرایط استفاده: ۱. کاربر: هر حساب تک کاربره، منحصر به یک نفر و حداکثر قابل استفاده در ۳ دستگاه شخصی است؛ سایت پلن گروهی ارائه نمیکند و پخش همزمان در چندین دستگاه و اشتراک گذاری مشخصات کاربری با سایر افراد حتی اعضای خانواده ممنوع می باشد.");
                //}
            }
        }
        
        function captionFontResize(n){
            captionFontSize += n;
            if(captionFontSize > 3 && captionFontSize<48)
                captionFontSize = captionFontSize; // xD
            else
                captionFontSize = 10;
                
            tmpObj = {"back":true, "backgroundOpacity":25, "edgeStyle":"dropShadow", "fontSize": captionFontSize, "fontOpacity":100, "windowOpacity":0, "fontFamily":"Vazir"}
            
            if (typeof(Storage) !== "undefined") {
                tmpVal = localStorage.getItem("jwplayer.captions");
                
                if ( tmpVal == null )
                    playerConf = tmpObj;
                else
                    playerConf = JSON.parse(tmpVal);
                    
                backup1 = playerConf.color;
                backup2 = playerConf.backgroundOpacity;
                
                                    playerConf.color = "#ffff00";
                    playerConf.backgroundOpacity = 75;
                 
                
                playerConf.fontSize = captionFontSize;
                
                if (timeoutCue !== null)
                    clearTimeout(timeoutCue);
                    
                timeoutCue = setTimeout(function() {
                    playerInstance.setCaptions(playerConf);
                }, 1000);
                
                playerConf.color = backup1;
                playerConf.backgroundOpacity = backup2;
                localStorage.setItem('jwplayer.captions', JSON.stringify(playerConf));
            } else {
                playerInstance.setCaptions(tmpObj);
            }
        }
        
        playerInstance.on('fullscreen', function(e) {
            setTimeout(function(){captionFontResize(0);}, 1000);
        });
        
        playerInstance.on('setupError', function(e) {
            logPlayerError('setupError', e.message);
        });
        
                
        playerInstance.on('error', function(e) {
            logPlayerError('error', e.code);
        });
        
        playerInstance.on('warning', function(e) {
            logPlayerError('warning', e.code);
        });
        
            </script>

    <script>
        function nth2IfDualSub() {
            nth = playerInstance.getCurrentCaptions();
            
            if (nth <= 0)
                return;
            
            tmpBuffer = '';
            
            if (playerInstance.getCaptionsList()[nth].label == 'English + Farsi')

    <div id='responsiveCaptionPosition'></div>
    <script>
    setInterval(function(){
        hNormal = (854/window.innerWidth)*window.innerHeight;
        hVertical = (854/window.innerHeight)*window.innerWidth;
        
        if (screen.width < screen.height) {
            tmpH = hNormal;
            hNormal = hVertical;
            hVertical = tmpH;
        }
        
        tmpPercent = parseInt(100-(460/hNormal*100));
        tmpPercentVertical = parseInt(100-1.6*(460/hVertical*100));
        
        tmpBuffer = '';
        
        if(tmpPercent>=3 && tmpPercent<=42){
            tmpBuffer += "<style>@media (min-aspect-ratio: 1/1) {.jw-captions{top:-"+(tmpPercent/6)+"% !important}\n.jw-flag-user-inactive .jw-captions{top:-"+(tmpPercent/3)+"% !important}}</style>";
            tmpBuffer += "<style>@media (min-aspect-ratio: 1/1) {.jw-text-track-display:nth-child(2){top:"+(tmpPercent/6)+"% !important}\n.jw-flag-user-inactive .jw-text-track-display:nth-child(2){top:"+(tmpPercent/3)+"% !important}}</style>";
        }
        
        if(tmpPercentVertical>=3 && tmpPercentVertical<=80){
            tmpBuffer += "<style>@media (max-aspect-ratio: 1/1) {.jw-captions{top:-"+(tmpPercentVertical/2-8)+"% !important}\n.jw-flag-user-inactive .jw-captions{top:-"+(tmpPercentVertical/2)+"% !important}}</style>";
            tmpBuffer += "<style>@media (max-aspect-ratio: 1/1) {.jw-text-track-display:nth-child(2){top:"+(tmpPercentVertical/2-8)+"% !important}\n.jw-flag-user-inactive .jw-text-track-display:nth-child(2){top:"+(tmpPercentVertical/2)+"% !important}}</style>";
        }
        
        document.getElementById('responsiveCaptionPosition').innerHTML = tmpBuffer;
    }, 1000);
    </script>
<style>
    .jw-captions-text{display:none !important};
</style>
